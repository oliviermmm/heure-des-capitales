name: Tests

# Vérifie, ne livre rien : la livraison part d'un tag, dans livraison.yml.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
